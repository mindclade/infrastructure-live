apiVersion: mindclade.io/v1alpha1
kind: Component
metadata:
  name: infrastructure-live
  description: Environment-specific Google Cloud composition, reviewed plans, and infrastructure state references.
  annotations:
    github.com/project-slug: mindclade/infrastructure-live
spec:
  type: infrastructure-control-plane
  lifecycle: pre-production
  maturity: pre-production
  owner: platform-operations
  security_reviewers:
    - security
  repository_class: infrastructure-source
  trust_tier: privileged
  recovery_tier: tier-0
  data_classification: confidential
  production_authority: false
  dependencies:
    - component:bootstrap
  provides:
    - infrastructure-catalog-v1
    - infrastructure-export-v1
    - infrastructure-plan-evidence-v1
  consumers:
    - component:gitops
  release:
    strategy: reviewed-main
    artifact: source-commit
    immutable: true
    evidence:
      - reviewed-plan-digest
      - policy-verification
      - apply-receipt
  activation:
    source_ready:
      description: Source, metadata, policy, tests, and required reviews are complete; no Google Cloud or GitHub mutation is implied.
    connected:
      description: Protected GitHub and Google Cloud identities, state backends, resources, and recovery have been independently verified against the exact qualified commit.
