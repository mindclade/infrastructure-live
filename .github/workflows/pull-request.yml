name: pull-request

"on":
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.6"
  GO_LINUX_AMD64_SHA256: 708effb774be8237570d0add163225abbdfaf4fca28b2611df167beba4feef89
  PYTHON_VERSION: "3.14.7"
  PYTHON_STANDALONE_RELEASE: "20260805"
  PYTHON_LINUX_AMD64_SHA256: a3a4e4b81b138960c7c546694df8a77578c0b6aa46d47e96f49b9e10e8f860c9
  JUST_VERSION: "1.55.1"
  JUST_LINUX_AMD64_SHA256: b0ef600f0df20d5ae91ae931627c499fc52b477ffe5f5ea7b7b3ec616b16c778
  TOFU_VERSION: "1.12.2"
  TOFU_LINUX_AMD64_SHA256: dc0ad16a42b3bfb5f3ceff3dcd5e9cd4c55271fae9f4bfe611749ff8ae6ec23c
  USE_BAZEL_VERSION: "9.2.0"

jobs:
  required:
    name: required
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out candidate source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install checksum-verified Go
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/go.tar.gz"
          toolchains="${RUNNER_TEMP}/toolchains"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" --output "${archive}"
          printf '%s  %s\n' "${GO_LINUX_AMD64_SHA256}" "${archive}" | sha256sum --check --strict
          mkdir -p "${toolchains}"
          tar -xzf "${archive}" -C "${toolchains}"
          printf '%s\n' "${toolchains}/go/bin" >>"${GITHUB_PATH}"

      - name: Install checksum-verified Python
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/python.tar.gz"
          toolchains="${RUNNER_TEMP}/toolchains"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            "https://github.com/astral-sh/python-build-standalone/releases/download/${PYTHON_STANDALONE_RELEASE}/cpython-${PYTHON_VERSION}+${PYTHON_STANDALONE_RELEASE}-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz" \
            --output "${archive}"
          printf '%s  %s\n' "${PYTHON_LINUX_AMD64_SHA256}" "${archive}" | sha256sum --check --strict
          mkdir -p "${toolchains}"
          tar -xzf "${archive}" -C "${toolchains}"
          printf '%s\n' "${toolchains}/python/bin" >>"${GITHUB_PATH}"

      - name: Set up Bazel without a shared writable cache
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: "1.29.0"
          bazelisk-cache: true
          disk-cache: false
          repository-cache: false

      - name: Install checksum-verified OpenTofu
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/tofu.zip"
          bin_dir="${RUNNER_TEMP}/tofu-bin"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.zip" \
            --output "${archive}"
          printf '%s  %s\n' "${TOFU_LINUX_AMD64_SHA256}" "${archive}" | sha256sum --check --strict
          mkdir -p "${bin_dir}"
          unzip -q "${archive}" -d "${bin_dir}"
          chmod 0755 "${bin_dir}/tofu"
          printf '%s\n' "${bin_dir}" >>"${GITHUB_PATH}"

      - name: Install checksum-verified just
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/just.tar.gz"
          bin_dir="${RUNNER_TEMP}/just-bin"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "${archive}"
          printf '%s  %s\n' "${JUST_LINUX_AMD64_SHA256}" "${archive}" | sha256sum --check --strict
          mkdir -p "${bin_dir}"
          tar -xzf "${archive}" -C "${bin_dir}" just
          chmod 0755 "${bin_dir}/just"
          printf '%s\n' "${bin_dir}" >>"${GITHUB_PATH}"

      - name: Install pinned source-validation tools
        run: |
          set -euo pipefail
          go install github.com/open-policy-agent/conftest@v0.69.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          printf '%s\n' "$(go env GOPATH)/bin" >>"${GITHUB_PATH}"

      - name: Validate source without cloud identity
        run: just validate

      - name: Run repository tests without cloud identity
        run: just test
