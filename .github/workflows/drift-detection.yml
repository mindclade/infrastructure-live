name: drift-detection

"on":
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure-drift-detection
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.7"
  GO_LINUX_AMD64_SHA256: ffb5f8de10c62550dfddab66b36b57030721e0a44a3218e9e1181d7b59f121ca
  TOFU_VERSION: "1.12.6"
  TOFU_LINUX_AMD64_SHA256: 5dc43da4f750f33873dc25e94587128709e819e544b7be9016b255316153c3a8

jobs:
  preflight:
    name: connected-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Skip cleanly until the connected read-only bindings are provisioned. Without
    # this guard the scheduled run fails every day on the assertions below, which
    # burns Actions minutes and hides real drift failures behind a standing red.
    if: >-
      github.ref == 'refs/heads/main'
      && vars.INFRASTRUCTURE_CONNECTED_READY == 'true'
    env:
      CONNECTED_READY: ${{ vars.INFRASTRUCTURE_CONNECTED_READY }}
    steps:
      - name: Require qualified read-only bindings
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${CONNECTED_READY}" = "true"

  classify:
    name: ${{ matrix.environment }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: trusted-build
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        environment: [development, staging, production, restricted]
    env:
      STATE_BUCKET: ${{ vars.INFRASTRUCTURE_STATE_BUCKET }}
      STATE_PREFIX: ${{ vars.INFRASTRUCTURE_STATE_PREFIX }}
      WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER_INFRASTRUCTURE_PLAN }}
      WIF_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT_INFRASTRUCTURE_PLAN }}
    steps:
      - name: Require environment-scoped read-only bindings
        shell: bash
        run: |
          set -euo pipefail
          test -n "${STATE_BUCKET}"
          test -n "${STATE_PREFIX}"
          test -n "${WIF_PROVIDER}"
          test -n "${WIF_SERVICE_ACCOUNT}"

      - name: Check out exact main source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install checksum-verified Go
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/go.tar.gz"
          toolchains="${RUNNER_TEMP}/toolchains"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" --output "${archive}"
          printf '%s  %s\n' "${GO_LINUX_AMD64_SHA256}" "${archive}" | sha256sum --check --strict
          mkdir -p "${toolchains}"
          tar -xzf "${archive}" -C "${toolchains}"
          printf '%s\n' "${toolchains}/go/bin" >>"${GITHUB_PATH}"

      - name: Install checksum-verified OpenTofu
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/tofu.zip"
          bin_dir="${RUNNER_TEMP}/tofu-bin"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.zip" \
            --output "${archive}"
          printf '%s  %s\n' "${TOFU_LINUX_AMD64_SHA256}" "${archive}" | sha256sum --check --strict
          mkdir -p "${bin_dir}"
          unzip -q "${archive}" -d "${bin_dir}"
          chmod 0755 "${bin_dir}/tofu"
          printf '%s\n' "${bin_dir}" >>"${GITHUB_PATH}"

      - name: Install pinned policy verifier
        run: |
          set -euo pipefail
          go install github.com/open-policy-agent/conftest@v0.69.0
          printf '%s\n' "$(go env GOPATH)/bin" >>"${GITHUB_PATH}"

      - name: Authenticate the read-only plan identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          audience: sts.googleapis.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Build the redacting classifier
        run: |
          set -euo pipefail
          umask 077
          cd tooling
          go build -trimpath -o "${RUNNER_TEMP}/infractl" ./cmd/infractl

      - name: Create a read-only drift plan and redacted evidence
        id: drift
        shell: bash
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          umask 077
          evidence_dir="${RUNNER_TEMP}/drift-evidence-${ENVIRONMENT}"
          summary_tsv="${RUNNER_TEMP}/drift-summary-${ENVIRONMENT}.tsv"
          mkdir -m 0700 "${evidence_dir}"
          : >"${summary_tsv}"
          failures=0

          emit_failure() {
            local stack="$1"
            local reason="$2"
            local exit_code="$3"
            jq -n \
              --arg apiVersion "infrastructure.mindclade.dev/drift-evidence/v1" \
              --arg environment "${ENVIRONMENT}" \
              --arg stack "${stack}" \
              --arg sourceCommit "${GITHUB_SHA}" \
              --arg status "failed" \
              --arg reasonCode "${reason}" \
              --argjson exitCode "${exit_code}" \
              '{apiVersion: $apiVersion, environment: $environment, stack: $stack, sourceCommit: $sourceCommit, status: $status, reasonCode: $reasonCode, exitCode: $exitCode}' \
              >"${evidence_dir}/${stack}.evidence.json"
            printf '%s\tfailed\t%s\n' "${stack}" "${reason}" >>"${summary_tsv}"
            failures=$((failures + 1))
          }

          for stack in foundation network artifacts data-services clusters ci-execution observability; do
            root="opentofu/live/${ENVIRONMENT}/${stack}"
            work_dir="${RUNNER_TEMP}/drift-${ENVIRONMENT}-${stack}"
            data_dir="${work_dir}/tofu-data"
            saved_plan="${work_dir}/drift.tfplan"
            plan_json="${work_dir}/drift.plan.json"
            plan_log="${work_dir}/drift.plan.log"
            classification="${work_dir}/drift.classification.json"
            policy_result="${work_dir}/drift.policy.json"
            mkdir -m 0700 "${work_dir}"
            export TF_DATA_DIR="${data_dir}"

            set +e
            tofu -chdir="${root}" init -input=false \
              -backend-config="bucket=${STATE_BUCKET}" \
              -backend-config="prefix=${STATE_PREFIX}/${ENVIRONMENT}/${stack}" \
              >"${plan_log}" 2>&1
            init_status="$?"
            set -e
            if [[ "${init_status}" -ne 0 ]]; then
              printf '::error title=%s/%s::OpenTofu init failed; raw output is suppressed.\n' "${ENVIRONMENT}" "${stack}"
              emit_failure "${stack}" "TOFU_INIT_FAILED" "${init_status}"
              rm -rf "${work_dir}"
              continue
            fi

            set +e
            tofu -chdir="${root}" plan -input=false -lock=false -detailed-exitcode \
              -out="${saved_plan}" >>"${plan_log}" 2>&1
            plan_status="$?"
            set -e
            if [[ "${plan_status}" -ne 0 && "${plan_status}" -ne 2 ]]; then
              printf '::error title=%s/%s::OpenTofu plan failed; raw output is suppressed.\n' "${ENVIRONMENT}" "${stack}"
              emit_failure "${stack}" "TOFU_PLAN_FAILED" "${plan_status}"
              rm -rf "${work_dir}"
              continue
            fi

            set +e
            tofu -chdir="${root}" show -json "${saved_plan}" >"${plan_json}" 2>>"${plan_log}"
            show_status="$?"
            set -e
            if [[ "${show_status}" -ne 0 ]]; then
              emit_failure "${stack}" "TOFU_SHOW_FAILED" "${show_status}"
              rm -rf "${work_dir}"
              continue
            fi

            set +e
            "${RUNNER_TEMP}/infractl" plan classify \
              --input "${plan_json}" >"${classification}" 2>>"${plan_log}"
            classifier_status="$?"
            set -e
            if [[ "${classifier_status}" -ne 0 && "${classifier_status}" -ne 2 ]]; then
              emit_failure "${stack}" "PLAN_CLASSIFICATION_FAILED" "${classifier_status}"
              rm -rf "${work_dir}"
              continue
            fi

            set +e
            conftest test "${plan_json}" \
              --policy policy --all-namespaces --output json >"${policy_result}" 2>>"${plan_log}"
            policy_status="$?"
            set -e
            if [[ "${policy_status}" -ne 0 && "${policy_status}" -ne 1 ]]; then
              emit_failure "${stack}" "POLICY_EVALUATION_FAILED" "${policy_status}"
              rm -rf "${work_dir}"
              continue
            fi
            if ! jq -e . "${policy_result}" >/dev/null 2>>"${plan_log}"; then
              emit_failure "${stack}" "POLICY_RESULT_INVALID" "1"
              rm -rf "${work_dir}"
              continue
            fi

            policy_passed=false
            if [[ "${policy_status}" -eq 0 ]]; then
              policy_passed=true
            fi
            plan_digest="$(jq -er '.digest' "${classification}")"
            policy_digest="sha256:$(sha256sum "${policy_result}" | awk '{print $1}')"
            status=passed
            reason=NO_DRIFT
            if [[ "${plan_status}" -eq 2 ]]; then
              status=failed
              reason=DRIFT_DETECTED
              failures=$((failures + 1))
            elif [[ "${policy_passed}" != true ]]; then
              status=failed
              reason=POLICY_DENIED
              failures=$((failures + 1))
            fi
            jq -n \
              --arg apiVersion "infrastructure.mindclade.dev/drift-evidence/v1" \
              --arg environment "${ENVIRONMENT}" \
              --arg stack "${stack}" \
              --arg sourceCommit "${GITHUB_SHA}" \
              --arg status "${status}" \
              --arg reasonCode "${reason}" \
              --arg planDigest "${plan_digest}" \
              --arg policyDigest "${policy_digest}" \
              --argjson planExitCode "${plan_status}" \
              --argjson policyPassed "${policy_passed}" \
              --slurpfile classification "${classification}" \
              '{apiVersion: $apiVersion, environment: $environment, stack: $stack, sourceCommit: $sourceCommit, status: $status, reasonCode: $reasonCode, planDigest: $planDigest, planExitCode: $planExitCode, policyPassed: $policyPassed, policyDigest: $policyDigest, classification: $classification[0]}' \
              >"${evidence_dir}/${stack}.evidence.json"
            printf '%s\t%s\t%s\n' "${stack}" "${status}" "${reason}" >>"${summary_tsv}"
            rm -rf "${work_dir}"
          done

          jq -s \
            --arg apiVersion "infrastructure.mindclade.dev/drift-manifest/v1" \
            --arg environment "${ENVIRONMENT}" \
            --arg sourceCommit "${GITHUB_SHA}" \
            --argjson failureCount "${failures}" \
            '{apiVersion: $apiVersion, environment: $environment, sourceCommit: $sourceCommit, failureCount: $failureCount, results: .}' \
            "${evidence_dir}"/*.evidence.json >"${evidence_dir}/manifest.json"
          {
            printf '### Drift: %s\n\n' "${ENVIRONMENT}"
            printf '| Stack | Result | Reason |\n|---|---|---|\n'
            while IFS="$(printf '\t')" read -r stack status reason; do
              # shellcheck disable=SC2016
              printf '| `%s` | %s | `%s` |\n' "${stack}" "${status}" "${reason}"
            done <"${summary_tsv}"
          } >>"${GITHUB_STEP_SUMMARY}"
          printf 'failure_count=%s\n' "${failures}" >>"${GITHUB_OUTPUT}"

      - name: Retain redacted drift evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: drift-${{ matrix.environment }}-${{ github.sha }}
          path: ${{ runner.temp }}/drift-evidence-${{ matrix.environment }}
          if-no-files-found: error
          retention-days: 30

      - name: Enforce aggregate drift result
        if: always()
        env:
          DRIFT_OUTCOME: ${{ steps.drift.outcome }}
          FAILURE_COUNT: ${{ steps.drift.outputs.failure_count }}
        run: |
          set -euo pipefail
          test "${DRIFT_OUTCOME}" = success
          test "${FAILURE_COUNT}" = 0
