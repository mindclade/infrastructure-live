version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Detroit
    groups:
      github-actions:
        patterns: ["*"]
    labels: [dependencies, security-review]
    reviewers: [mindclade/infrastructure, mindclade/security]
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /tooling
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: America/Detroit
    groups:
      tooling-runtime:
        patterns: ["*"]
    labels: [dependencies, go, security-review]
    reviewers: [mindclade/platform, mindclade/security]
    open-pull-requests-limit: 5

  - package-ecosystem: bazel
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: America/Detroit
    groups:
      bazel-modules:
        patterns: ["*"]
    labels: [dependencies, bazel, security-review]
    reviewers: [mindclade/platform, mindclade/security]
    open-pull-requests-limit: 3

  - package-ecosystem: terraform
    directories:
      - /opentofu/live/*/*
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: America/Detroit
    groups:
      opentofu-providers:
        patterns: ["*"]
    labels: [dependencies, opentofu, security-review]
    reviewers: [mindclade/infrastructure, mindclade/security]
    open-pull-requests-limit: 3
